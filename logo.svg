<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="0.5" stop-color="#4d96ff"/>
      <stop offset="1" stop-color="#6bcb77"/>
    </linearGradient>
  </defs>

  <!-- outer coloured ring -->
  <circle cx="100" cy="100" r="96" fill="url(#ring)"/>
  <!-- dark inner circle -->
  <circle cx="100" cy="100" r="80" fill="#333"/>

  <!-- the four signs: + − × = -->
  <g stroke="#fff" stroke-width="10" stroke-linecap="round">
    <!-- plus -->
    <line x1="72" y1="56" x2="72" y2="88"/>
    <line x1="56" y1="72" x2="88" y2="72"/>
    <!-- minus -->
    <line x1="112" y1="72" x2="144" y2="72"/>
    <!-- times -->
    <line x1="60" y1="116" x2="84" y2="140"/>
    <line x1="84" y1="116" x2="60" y2="140"/>
    <!-- equals -->
    <line x1="112" y1="120" x2="144" y2="120"/>
    <line x1="112" y1="136" x2="144" y2="136"/>
  </g>
</svg>
